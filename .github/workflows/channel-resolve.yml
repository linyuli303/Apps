name: Resolve owner channel handles

on:
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: channel-resolution-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.repository == 'linyuli303/Apps' &&
      github.ref == 'refs/heads/main' &&
      github.actor_id == '42029941' &&
      github.event.issue.user.id == 42029941 &&
      github.event.repository.owner.id == 42029941 &&
      github.event.issue.title == '[MyTube] Resolve channels'
    environment: youtube-refresh
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read

    steps:
      - name: Checkout the triggering trusted main snapshot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Check tracked files
        run: python scripts/security_check.py

      - name: Run offline tests without application secrets
        run: python -m unittest discover -s tests -v

      - name: Resolve identities without approving additions
        env:
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: >-
          python scripts/resolve_channel_request.py
          --output "${{ runner.temp }}/channel-identity-review.txt"

      - name: Save advisory identity review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: channel-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/channel-identity-review.txt
          if-no-files-found: error
          retention-days: 1
          overwrite: false

      - name: Explain the separate approval step
        run: |
          printf '%s\n' \
            '## Channel identity review' \
            'Download the channel-review artifact from this run.' \
            'Read the titles, immutable UC IDs and official channel URLs.' \
            'Then open the bulk-add form link from the TXT report.' \
            'Review, confirm and submit that separate Issue as owner.' \
            '**No channels were added by this resolver.**' \
            >> "$GITHUB_STEP_SUMMARY"
