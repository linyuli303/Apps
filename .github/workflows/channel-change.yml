name: Apply owner channel request
on:
  issues:
    types: [opened]
permissions: {}
jobs:
  apply:
    if: >-
      github.repository == 'linyuli303/Apps' &&
      github.ref == 'refs/heads/main' &&
      github.actor_id == '42029941' &&
      github.event.issue.user.id == 42029941 &&
      github.event.repository.owner.id == 42029941 &&
      github.event.issue.title == '[MyTube] Channel change'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
      actions: write
    steps:
      - name: Checkout trusted main only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Check tracked files
        run: python scripts/security_check.py
      - name: Run offline tests without write token in environment
        run: python -m unittest discover -s tests -v
      - name: Validate live request, update whitelist, and request publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/process_channel_request.py
