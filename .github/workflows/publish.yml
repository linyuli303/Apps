name: Refresh and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reuse_published_feed:
        description: "Deploy frontend using published feed; no YouTube calls"
        required: false
        default: false
        type: boolean
  # Hour selection is controlled by YOUTUBE_REFRESH_HOURS_UTC.
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 1 * * *"
    - cron: "0 2 * * *"
    - cron: "0 3 * * *"
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
    - cron: "0 9 * * *"
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
    - cron: "0 15 * * *"
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
    - cron: "0 18 * * *"
    - cron: "0 19 * * *"
    - cron: "0 20 * * *"
    - cron: "0 21 * * *"
    - cron: "0 22 * * *"
    - cron: "0 23 * * *"
permissions: {}
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  schedule-diagnostics:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    env:
      SCHEDULE_CRON: ${{ github.event.schedule }}
      CONFIGURED_HOURS: ${{ vars.YOUTUBE_REFRESH_HOURS_UTC }}
      RUN_REF: ${{ github.ref }}
    steps:
      - name: Explain scheduled hour selection
        shell: python
        run: |
          import json
          import os
          cron = os.environ["SCHEDULE_CRON"]
          configured = os.environ.get("CONFIGURED_HOURS", "")
          effective = configured or "09,12,18,22"
          parts = cron.split()
          hour = f"{int(parts[1]):02d}" if len(parts) == 5 else None
          selected = hour is not None and f",{hour}," in f",{effective},"
          print("Cron expression:", json.dumps(cron))
          print("Intended UTC hour:", hour)
          print("Repository variable:", json.dumps(configured))
          print("Effective hours:", json.dumps(effective))
          print("Branch ref:", os.environ["RUN_REF"])
          print("Hour selected by existing gate:", selected)
  build:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || contains(format(',{0},', vars.YOUTUBE_REFRESH_HOURS_UTC || '09,12,18,22'), format(',{0},', fromJSON('{"0 0 * * *":"00","0 1 * * *":"01","0 2 * * *":"02","0 3 * * *":"03","0 4 * * *":"04","0 5 * * *":"05","0 6 * * *":"06","0 7 * * *":"07","0 8 * * *":"08","0 9 * * *":"09","0 10 * * *":"10","0 11 * * *":"11","0 12 * * *":"12","0 13 * * *":"13","0 14 * * *":"14","0 15 * * *":"15","0 16 * * *":"16","0 17 * * *":"17","0 18 * * *":"18","0 19 * * *":"19","0 20 * * *":"20","0 21 * * *":"21","0 22 * * *":"22","0 23 * * *":"23"}')[github.event.schedule])))
    environment: youtube-refresh
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check tracked files for private exports and credentials
        run: python scripts/security_check.py
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Select refresh or public-feed reuse
        id: feed-mode
        run: python scripts/select_feed_mode.py
      - name: Reuse validated public snapshot without YouTube calls
        if: steps.feed-mode.outputs.refresh == 'false'
        run: python scripts/reuse_public_feed.py
      - name: Fetch approved-channel snapshot
        if: steps.feed-mode.outputs.refresh == 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/build_feed.py
      - name: Validate and stage only public website assets
        run: python scripts/prepare_site.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
          retention-days: 1
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
